apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: sport-booking

spec:
  replicas: 2

  selector:
    matchLabels:
      app: redis

  template:
    metadata:
      labels:
        app: redis

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: redis
          image: localhost:5000/redis:latest
          imagePullPolicy: Always

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          ports:
            - containerPort: 6379
              protocol: TCP

          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 20

          resources:
            requests:
              cpu: 500m
              memory: 128Mi

            limits:
              cpu: 1000m
              memory: 512Mi


