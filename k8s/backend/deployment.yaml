apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: sport-booking

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: backend

          image: localhost:5000/sport-booking:1.0.4

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          ports:
            - containerPort: 8000

          envFrom:
            - configMapRef:
                name: backend-config

          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: SECRET_KEY

            - name: PORT
              value: "8000"

          readinessProbe:
            httpGet:
              path: api/v1/readiness/
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3  

          livenessProbe:
            httpGet:
              path: api/v1/liveness/
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3   

          resources:
            requests:
              cpu: 800m
              memory: 512Mi

            limits:
              cpu: 1200m
              memory: 1Gi
